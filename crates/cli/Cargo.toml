[package]
name = "araiguma-cli"
description = "Araiguma read-only snapshot and watch CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "araiguma_cli"
path = "src/lib.rs"

[[bin]]
name = "araiguma"
path = "src/main.rs"

[dependencies]
araiguma-core = { workspace = true }
araiguma-sysfs = { workspace = true }
araiguma-netlink = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
